"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Person spotlight
description: One person shown as a mobile, with each of their roles (care, learn, discover) hanging from them. Rendered by
  the "Person spotlight" block.
group: Calder
status: stable
noUi: true
props:
  type: object
  properties:
    eyebrow:
      type:
      - string
      - 'null'
    heading:
      type:
      - string
      - 'null'
    text:
      type:
      - string
      - 'null'
    person:
      type:
      - object
      - 'null'
    roles:
      type:
      - array
      - 'null'
      description: '[{mission, label, text, url}]'
