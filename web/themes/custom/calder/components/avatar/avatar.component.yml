"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Avatar
description: A person's photo or monogram, with one small shape per role (care, learn, discover) hanging at the edge, like
  a mobile.
group: Calder
status: stable
noUi: true
props:
  type: object
  properties:
    initials:
      type:
      - string
      - 'null'
    roles:
      type:
      - array
      - 'null'
      items:
        type: string
    photo:
      type:
      - object
      - 'null'
    size:
      type:
      - string
      - 'null'
      description: 'One of: sm, md, lg.'
