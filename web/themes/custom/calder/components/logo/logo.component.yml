"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Logo
description: Calder University Health logo. A small mobile (one shape per mission) and the wordmark.
group: Calder
status: stable
noUi: true
props:
  type: object
  properties:
    tone:
      type:
      - string
      - 'null'
      title: Tone
      description: 'One of: dark, light.'
    url:
      type:
      - string
      - 'null'
      title: Link
      format: uri-reference
    mark_only:
      type:
      - boolean
      - 'null'
      title: Mark only
