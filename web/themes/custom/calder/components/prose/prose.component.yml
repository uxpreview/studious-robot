"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Rich text block
description: A heading and formatted text at a comfortable reading width.
group: Calder
status: stable
props:
  type: object
  required: [text]
  properties:
    heading: { type: string, title: Heading, examples: ["Parking"] }
    text:
      type: string
      title: Text
      contentMediaType: text/html
      x-formatting-context: block
      examples: ["<p>Parking is free for the first 30 minutes.</p>"]
