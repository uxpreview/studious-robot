name: drupal-sandbox
type: drupal11
docroot: web
ddev_version_constraint: '>= 1.25.0'
web_environment:
  # Lets Drupal know when it is running inside GitHub Codespaces.
  # See web/sites/default/settings.php.
  - CODESPACES
  - CODESPACE_NAME
  - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN
hooks:
  post-start:
    - composer: install
    # First start only: if no site is installed yet, build the Calder demo.
    - exec: |
        if ! drush status --field=bootstrap 2>/dev/null | grep -q Successful; then
          bash /mnt/ddev_config/commands/web/reset --yes
        fi
