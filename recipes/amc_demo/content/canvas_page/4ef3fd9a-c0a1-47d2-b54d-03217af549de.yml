      slot: content
      uuid: f00ce455-9c8a-405d-a837-46120effd227
      component_id: sdc.calder.prose
      inputs:
        heading: 'The idea: one person, many roles'
        text:
          value: '<p>At an academic medical center, the same doctor treats patients, teaches students and leads research. Most websites store that person three or four times, and the copies drift apart.</p><p>Here, each person is entered once. Find a Doctor, the faculty directory, condition pages, clinical trials, programs, events and news all draw from that one profile. Edit it, and every page updates. Each page also shows what connects to it, so a condition guide lists its specialists and studies without anyone maintaining those lists.</p>'
          format: canvas_html_block
    -
      parent_uuid: 1bc7f25d-1a61-45b3-b515-620bb05ce03e
      slot: content
      uuid: a0184643-2f1c-4dda-a3dd-70f6786dce39
      component_id: sdc.calder.prose
      inputs:
        heading: 'Structured content, flexible pages'
        text:
          value: '<p>Doctors, conditions, locations, trials, programs, labs, events and news are structured content types with their own fields. Their pages follow designed templates, so they stay consistent and accessible.</p><p>Landing pages like the homepage are built in <strong>Drupal Canvas</strong>, the visual page builder in Drupal CMS. Editors drag in heroes, sections, cards, statistics and live lists from the Calder component library, and can drop in a <em>Person spotlight</em> for any doctor.</p>'
          format: canvas_html_block
    -
      parent_uuid: 1bc7f25d-1a61-45b3-b515-620bb05ce03e
      slot: content
      uuid: de9e0d5a-f417-46ea-b32f-8001259bfab4
      component_id: sdc.calder.prose
      inputs:
        heading: 'A design system with a story'
        text:
          value: '<p>The identity comes from Alexander Calder’s mobiles: separate parts held in balance. Red marks patient care, blue marks education and ochre marks research, so color always tells you where you are. The illustrations are generated mobiles that physically balance, and they sway gently unless you have reduced motion turned on.</p><p>Headlines are set in Newsreader. Body text uses Atkinson Hyperlegible Next, designed by the Braille Institute for readers with low vision. Every text color meets WCAG AA contrast.</p>'
          format: canvas_html_block
    -
      parent_uuid: 1bc7f25d-1a61-45b3-b515-620bb05ce03e
      slot: content
      uuid: b3d853a5-d9f5-4f8e-a5ef-2c03813caba7
      component_id: sdc.calder.prose
      inputs:
        heading: 'Built to explore'
        text:
          value: '<p>It runs on Drupal CMS 2, with Canvas, Views, editorial workflow, search and the add-on browser. The whole demo, including content, is packaged as a site template, so it can be reset to a clean state in about a minute.</p><p>Things to try: search Find a Doctor for “AFib”, filter by language, open a condition guide, or log in and edit a doctor’s profile to watch the change appear everywhere.</p>'
          format: canvas_html_block
