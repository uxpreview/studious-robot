  field_body:
    -
      value: "<p>Dr. Samuel Brooks is a pediatric cardiologist who cares for babies, children and teens with <a href=\"/conditions/congenital-heart-disease\">congenital heart disease</a>, heart murmurs, chest pain, fainting and heart rhythm problems. He specializes in heart imaging, including echocardiograms and cardiac MRI. At Calder University Hospital, he performs fetal echocardiograms, detailed ultrasounds of a baby's heart during pregnancy, and meets with expecting parents to plan care before birth.</p><p>Dr. Brooks is the medical director of the new Pediatric Heart Clinic at the Children's Pavilion, which brings heart tests, specialist visits and support services into one place for families. He led a study, now completed, which showed that a faster, free-breathing MRI scan lets most children ages 4 to 12 skip sedation. That scan is now the standard first choice at the Pavilion.</p><p>Dr. Brooks is fluent in American Sign Language and can talk directly with Deaf parents and children. He teaches pediatric residents and cardiology fellows, and he is a member of both the Heart &amp; Vascular Institute and Children's Health.</p>"
