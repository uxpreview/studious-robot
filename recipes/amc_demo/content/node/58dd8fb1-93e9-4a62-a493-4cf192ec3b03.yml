      langcode: en
  field_body:
    -
      value: "<p>Families of children with heart conditions used to make several stops for a single checkup: an echocardiogram in one building, an ECG in another and a cardiology visit somewhere else. Now all of that happens in one place.</p><p>The new Pediatric Heart Clinic, on the third floor of the Children's Pavilion, brings together pediatric cardiologists, echocardiography, ECG and heart rhythm monitoring, a dedicated child life specialist and a nutritionist. The clinic also includes a cardiac MRI suite designed for children, with a projector that turns the scanner room into a small movie theater.</p><p>\"Most of our kids need heart checkups for the rest of their lives,\" says Dr. Samuel Brooks, the clinic's medical director. \"If we make every visit easier, families keep coming back, and that's what keeps these kids healthy.\"</p><p>The clinic is a partnership between Children's Health and the Heart &amp; Vascular Institute. It cares for babies, children and teens with congenital heart disease, heart murmurs, fainting, chest pain and rhythm problems. It also offers consultations for expecting parents whose baby has a heart condition found before birth, and a transition program to help teens move to adult heart care.</p><p>The MRI suite uses a faster, free-breathing scan tested in a Calder study led by Dr. Brooks. In that study, 86 percent of children ages 4 to 12 completed their scan without sedation.</p><p>To make an appointment, families can ask their child's pediatrician for a referral or call the Children's Pavilion at (555) 555-0130.</p>"
