  field_eligibility:
    -
      value: '<p><strong>You may be able to join if you:</strong></p><ul><li>Are 18–65 years old</li><li>Have had migraine for at least 1 year, starting before age 50</li><li>Have 4 or more migraine days a month, on average</li><li>Are willing to keep a short daily headache diary on your phone or on paper, in English or Spanish</li><li>Can come to Calder University Hospital once a month for the first 3 months</li></ul><p><strong>You may not be able to join if you:</strong></p><ul><li>Take, or took in the past 6 months, a medicine that blocks CGRP</li><li>Have tried more than 4 types of preventive migraine medicine without any improvement</li><li>Had a heart attack, stroke or mini-stroke in the past 12 months</li><li>Have high blood pressure that is not under control</li><li>Are pregnant, breastfeeding or planning a pregnancy</li></ul>'
      format: content_format
