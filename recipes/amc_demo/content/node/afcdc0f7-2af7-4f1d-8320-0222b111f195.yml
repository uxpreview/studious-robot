  field_age_range:
    -
      value: 18–65
  field_body:
    -
      value: '<p>Many people with migraine still have frequent attacks after trying several preventive medicines. This study is testing an investigational medicine, one that is not approved for general use, that blocks PACAP. PACAP is a natural signaling protein that appears to help start migraine attacks. Research in the Haddad Lab at Calder helped show how PACAP affects pain pathways in the brain.</p><p>For the first 12 weeks, participants are assigned by chance to receive either the study medicine or a placebo, a shot with no active medicine. Two out of every three people receive the study medicine. Neither you nor the study team will know which one you get. After 12 weeks, everyone who continues can receive the study medicine for up to 40 more weeks.</p><p>Our team includes bilingual research coordinators, and all consent forms, headache diaries and surveys are available in English and Spanish. We plan to enroll about 90 people at Calder.</p>'
      format: content_format
  field_conditions:
