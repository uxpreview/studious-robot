      value: recruiting
  field_what_to_expect:
    -
      value: '<ol><li><strong>Screening and diary.</strong> At your first visit, a coordinator reviews the study with you in English or Spanish. If you join, you keep a daily headache diary for 4 weeks before treatment starts.</li><li><strong>Treatment.</strong> You receive a shot under the skin at Calder University Hospital once a month for 3 months. Each visit takes about an hour.</li><li><strong>Extension.</strong> After 3 months, you can choose to receive the study medicine for up to 40 more weeks.</li><li><strong>Final check-in.</strong> A last visit takes place about 12 weeks after your final shot.</li></ol><p>You can keep using the medicines you already take to treat migraine attacks. The study medicine and study tests are provided at no cost, and you will receive $75 for each visit. Parking is validated. You can leave the study at any time without affecting your care.</p>'
      format: content_format
