  field_how_to_apply:
    -
      value: "<ol><li>Complete the online graduate application by December 1.</li><li>Upload transcripts from your college or university. A bachelor's degree in any field is accepted; coursework in biology, chemistry, psychology or computer science is helpful.</li><li>Write a personal statement about your research experience and interests, and name up to three faculty members whose work interests you.</li><li>Request three letters of recommendation, ideally from research mentors. We do not require graduate admissions test scores.</li><li>If selected, join us for an interview weekend in February. Travel costs are covered.</li><li>Receive your decision by mid-March. Admitted students have until April 15 to accept.</li></ol><p>Questions? Email neuroscience-phd@calder.example.</p>"
      format: content_format
  field_program_type:
