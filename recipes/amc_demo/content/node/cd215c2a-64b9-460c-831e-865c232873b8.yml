  field_body:
    -
      value: "<p>The PhD in Neuroscience brings together faculty from the School of Medicine, the Neurology and Neurosurgery department and the university's departments of biology, psychology and engineering. Students choose from 38 faculty labs studying topics from pain and sensation to memory, sleep and brain development.</p><p>In the first year, students take core courses in cellular, systems and computational neuroscience and complete three lab rotations before choosing a thesis lab. The qualifying exam takes place at the end of the second year. Students also gain teaching experience and can join a clinical immersion course, shadowing neurologists and neurosurgeons to see the questions patients bring to the clinic.</p><p>Every admitted student receives full tuition, health insurance and a yearly stipend for at least five years. Program director Dr. Laila Haddad and a team of faculty mentors meet with each student every year to plan for careers in academic research, industry, science policy and beyond.</p>"
      format: content_format
