  field_body:
    -
      value: '<p>High blood pressure and atrial fibrillation often cause no symptoms, so many people do not know they have them. Our free screening takes about 15 minutes and helps you know your numbers.</p><p><strong>What we check</strong></p><ul><li>Blood pressure</li><li>Heart rhythm, using a handheld 30-second ECG</li><li>Pulse and blood oxygen level</li></ul><p>Nurse practitioner Maria Santos and members of the Heart &amp; Vascular Institute team will go over your results with you in English, Spanish or Portuguese, and interpreters for other languages are available. If anything needs follow-up, we will help you schedule a visit, whether or not you have insurance.</p><p>This screening does not replace regular care from your own doctor. If you have chest pain, trouble breathing or signs of a stroke, call 911.</p>'
      format: content_format
