      value: 'Faster, longer-lasting catheter ablation'
    -
      value: 'Wearable rhythm monitoring after treatment'
    -
      value: 'Stroke prevention without long-term blood thinners'
    -
      value: 'Early rhythm control in newly diagnosed AFib'
  field_summary:
    -
      value: 'The Arrhythmia Research Lab studies how to treat atrial fibrillation and other heart rhythm problems more safely, more quickly and with longer-lasting results.'
