  field_body:
    -
      value: "<p>Led by cardiac electrophysiologist Dr. Priya Patel, the Arrhythmia Research Lab connects what happens in the heart rhythm lab to what happens in patients' lives afterward. The team studies ablation methods, stroke prevention and the large amounts of heart rhythm data collected by wearable monitors and implanted devices.</p><p>Much of the lab's work happens through clinical trials, including a current study comparing two approved ablation methods for atrial fibrillation. The lab also keeps a registry of more than 5,000 Calder patients treated for AFib, which researchers use to track long-term results and spot patterns a single study might miss.</p><p>Interventional cardiologist Dr. Marcus Reed leads the lab's work on left atrial appendage closure. Cardiology fellows spend research time in the lab, and the team welcomes medical students and data science trainees for summer projects.</p>"
