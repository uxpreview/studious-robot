  field_recent_work:
    -
      value: 'Found that wearing a patch monitor for two weeks after ablation caught returning AFib earlier and more often than a single ECG at a follow-up visit.'
    -
      value: 'Launched a randomized study comparing pulsed field and radiofrequency ablation for AFib, now enrolling at Calder University Hospital.'
    -
      value: 'Reported five-year stroke and bleeding rates for more than 600 Calder patients who had left atrial appendage closure.'
  field_research_focus:
