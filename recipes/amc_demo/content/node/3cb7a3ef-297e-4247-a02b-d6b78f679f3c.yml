  field_eligibility:
    -
      value: '<p><strong>You may be able to join if you:</strong></p><ul><li>Are 18–80 years old</li><li>Have AFib that causes symptoms, such as a racing heartbeat or tiredness</li><li>Have already decided with your heart doctor that ablation is right for you</li><li>Have tried, or cannot take, at least one heart rhythm medicine</li><li>Can come to follow-up visits for one year</li></ul><p><strong>You may not be able to join if you:</strong></p><ul><li>Have had an ablation for AFib before</li><li>Had heart surgery or a heart attack in the past 3 months</li><li>Have severe heart valve disease</li><li>Cannot take a blood thinner for at least 3 months around the time of the procedure</li><li>Are pregnant or plan to become pregnant during the study</li></ul><p>The study team will review your health history with you to confirm whether you can take part.</p>'
      format: content_format
