      value: recruiting
  field_what_to_expect:
    -
      value: '<p>Taking part lasts about one year.</p><ol><li><strong>Screening visit.</strong> A research nurse will explain the study, answer your questions and review your health history. You sign a consent form only if you decide to join.</li><li><strong>Assignment.</strong> A computer assigns you to pulsed field or radiofrequency ablation by chance, like flipping a coin.</li><li><strong>Procedure.</strong> Your ablation takes place at Calder University Hospital. Most people go home the same day or the next morning.</li><li><strong>Follow-up.</strong> You will have visits at the Riverside Outpatient Center at 3, 6 and 12 months. Before each visit, you will wear a small patch monitor on your chest for 2 weeks and fill out a short survey.</li></ol><p>Study tests and monitors are provided at no cost. You will receive $50 for each follow-up visit, and parking is free. You can leave the study at any time, and your care at Calder will not change.</p>'
      format: content_format
