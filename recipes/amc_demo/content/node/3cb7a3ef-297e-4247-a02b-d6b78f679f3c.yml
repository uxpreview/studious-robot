  field_age_range:
    -
      value: 18–80
  field_body:
    -
      value: '<p>Catheter ablation is a common treatment for atrial fibrillation (AFib). Calder doctors use two approved methods. Pulsed field ablation uses very short electrical pulses and usually takes less time. Radiofrequency ablation uses heat and has been used for many years. Both work well, but they have not been compared head to head in many patients over a full year.</p><p>In this study, people who are already planning to have an ablation will be assigned by chance to one of the two methods. We will compare how many people stay free of AFib after one year, how long each procedure takes, how quickly people recover and how they feel day to day.</p><p>We plan to enroll 240 people at Calder. What we learn could help doctors and patients choose the method that fits each person best.</p>'
      format: content_format
