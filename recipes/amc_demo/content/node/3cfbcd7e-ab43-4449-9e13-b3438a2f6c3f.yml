  field_body:
    -
      value: "<p>The MD program at the Calder University School of Medicine prepares physicians who can care for patients in any setting, from a small-town clinic to an intensive care unit. Students meet patients in their first week through our longitudinal community clinic program, and they follow the same small group of patients for all four years.</p><p>The curriculum has three phases. In the first 18 months, students learn the science of medicine in organ-based courses taught by scientists and clinicians together. The clerkship year places students on clinical teams across the health system in internal medicine, surgery, neurology, psychiatry, obstetrics and pediatrics. The pediatrics clerkship, led by Dr. Hannah Kim, takes place at the Children's Pavilion. The final phase offers advanced rotations, electives and focused preparation for residency.</p><p>Every student completes a scholarly concentration in research, medical education, health policy or community health. Many work in labs across the health system, from the Arrhythmia Research Lab to the Haddad Lab, and present their work before graduation.</p>"
      format: content_format
