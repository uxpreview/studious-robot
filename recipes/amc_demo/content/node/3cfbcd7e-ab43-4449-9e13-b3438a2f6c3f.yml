  field_how_to_apply:
    -
      value: '<ol><li>Submit the national medical school application and select the Calder University School of Medicine. Applications open in early summer.</li><li>Have your admissions test scores and college transcripts sent to us.</li><li>Complete the Calder secondary application, which includes three short essays, by November 1. We waive the fee for applicants who qualify for national fee assistance.</li><li>Request three letters of recommendation, or one committee letter from your college.</li><li>If invited, interview with us. Interviews run from September through January, in person or online.</li><li>Receive your decision. We make offers on a rolling basis starting in mid-October, and every applicant hears from us by March.</li></ol><p>Questions? Email admissions@calder.example or call (555) 555-0180.</p>'
      format: content_format
