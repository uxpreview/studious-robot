  field_body:
    -
      value: '<p>Our neurologists and neurosurgeons see patients at Calder University Hospital, where specialists, imaging and operating rooms are all under one roof. Many people come to us after other treatments have not helped. Others come for a second opinion before surgery. Either way, your first visit starts with a long conversation and a careful exam.</p><p>The Headache Medicine Program is one of the few in the region devoted only to migraine and other headache disorders. Neurologists, a headache nurse, a psychologist and a physical therapist work as one team, so you can get a full plan without collecting referrals. Our stroke team is in the hospital around the clock, and our neurosurgeons treat brain tumors, spine conditions and hydrocephalus using the least invasive approach that will safely do the job.</p><p>Researchers in our department study how the brain processes pain, how to prevent migraine and how to speed recovery after surgery. Taking part in a study is always your choice. <a href="/conditions/migraine">Learn more about migraine</a>.</p>'
      format: content_format
