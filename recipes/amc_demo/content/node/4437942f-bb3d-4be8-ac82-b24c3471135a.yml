  field_body:
    -
      value: '<p>Calder University Health has opened enrollment for a clinical trial testing whether an investigational medicine, given as a monthly shot, can reduce the number of days people spend with migraine. The study is led by Dr. Elena Ruiz, director of the Headache Medicine Program.</p><p>The medicine blocks PACAP, a signaling protein that rises during migraine attacks. Much of what scientists know about PACAP''s role in head pain comes from basic research, including work in the lab of Calder neuroscientist Dr. Laila Haddad. "We spent years watching what PACAP does in pain circuits," Dr. Haddad says. "Seeing that work reach a clinical trial in our own hospital is rare, and it is exciting."</p><p>From the start, Dr. Ruiz wanted the study to be easy to join for Spanish-speaking patients, who are often underrepresented in migraine research. Two bilingual research coordinators will guide participants through every step, and all forms, headache diaries and surveys are available in English and Spanish. "If you can''t fully understand a consent form, you can''t truly consent," Dr. Ruiz says. "Language should never be the reason someone can''t take part."</p><p>The study will enroll about 90 adults ages 18 to 65 at Calder. For the first 12 weeks, participants receive either the study medicine or a placebo. After that, everyone who continues can receive the study medicine for up to 40 more weeks. Study visits take place at Calder University Hospital.</p><p>Taking part in a clinical trial is always voluntary and does not affect your regular care. To learn more, call the study team at (555) 555-0158 or email migraine-study@calder.example.</p>'
