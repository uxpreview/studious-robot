  field_body:
    -
      value: '<p>Dr. James Okafor is a neurosurgeon who treats brain tumors, spinal cord compression, herniated discs, spinal stenosis and hydrocephalus. When surgery is the right choice, he uses the smallest approach that will safely do the job, which for many spine operations means a shorter incision and a shorter hospital stay. He sees patients at Calder University Hospital.</p><p>Dr. Okafor is also the Associate Dean for Admissions at the Calder University School of Medicine, where he leads the committee that selects each entering MD class. He has worked to widen the path into medicine for students from rural towns and from families with no doctors in them, and he still interviews applicants himself every fall.</p><p>He trained in neurological surgery at Calder University Hospital and completed a fellowship in complex spine surgery at Lakemont University Medical Center. He speaks English and Yoruba, and he runs a surgical skills lab where first-year medical students practice suturing and basic techniques.</p>'
