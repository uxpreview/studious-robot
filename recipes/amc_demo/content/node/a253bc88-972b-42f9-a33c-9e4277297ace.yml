  field_body:
    -
      value: '<p>At the Children''s Pavilion, your child can see a pediatrician for checkups and vaccines, get a same-day appointment when they are sick and see a specialist without leaving the building. Exam rooms have space for a parent, a stroller and a sibling or two. Child life specialists help kids understand what will happen during tests and procedures, using play and plain words.</p><p>Our new Pediatric Heart Clinic cares for babies, children and teens with <a href="/conditions/congenital-heart-disease">congenital heart disease</a>, heart murmurs, fainting and heart rhythm problems. Pediatric cardiologists work alongside our pediatricians, so heart care and everyday care stay connected.</p><p>Children grow up, and their care should grow with them. Starting around age 14, we help teens learn to manage their own health, and we work with adult specialists so that young people with ongoing conditions move to adult care without a gap.</p>'
      format: content_format
