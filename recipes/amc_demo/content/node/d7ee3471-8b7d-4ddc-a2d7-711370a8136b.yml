  field_body:
    -
      value: '<p>Dr. Marcus Reed is an interventional cardiologist. He uses thin tubes called catheters, threaded through a blood vessel in the wrist or groin, to open blocked heart arteries, place stents and treat heart attacks as they happen. He also performs left atrial appendage closure, a procedure that can lower stroke risk for some people with <a href="/conditions/atrial-fibrillation">atrial fibrillation</a> who cannot take blood thinners long term.</p><p>Many of Dr. Reed''s patients have <a href="/conditions/heart-failure">heart failure</a> caused by coronary artery disease. He works closely with nurse practitioner Maria Santos and the Heart Failure Clinic at Riverside so that care continues smoothly after a procedure. He is the principal investigator of a study testing whether at-home monitoring can help people with heart failure stay out of the hospital, and he is a member of the Arrhythmia Research Lab, where he tracks long-term results of appendage closure.</p><p>Dr. Reed grew up in Calder and earned his medical degree at the Calder University School of Medicine. He teaches residents and fellows in the cardiac catheterization lab, and cardiology fellows named him teacher of the year in 2024.</p>'
      format: content_format
