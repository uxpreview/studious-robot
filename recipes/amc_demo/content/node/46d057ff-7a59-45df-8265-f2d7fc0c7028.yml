  field_body:
    -
      value: '<p>Dr. Priya Patel is a cardiac electrophysiologist, a cardiologist who specializes in the heart''s electrical system. She treats <a href="/conditions/atrial-fibrillation">atrial fibrillation</a>, atrial flutter, supraventricular tachycardia and other heart rhythm problems. She performs catheter ablation, including pulsed field ablation, and implants pacemakers, defibrillators and devices that help a weakened heart pump in sync for people with <a href="/conditions/heart-failure">heart failure</a>. She sees patients at Calder University Hospital and the Riverside Outpatient Center.</p><p>Dr. Patel leads the Arrhythmia Research Lab, which studies how to make ablation faster and longer lasting, and how data from wearable monitors can show whether a treatment is working. She is the principal investigator of a randomized study comparing two approved ablation methods for AFib, and she speaks regularly at Cardiology Grand Rounds about what that research means for everyday practice.</p><p>As director of the Cardiovascular Disease Fellowship, Dr. Patel oversees the training of 12 cardiology fellows. She joined Calder in 2015 after completing her fellowship training at Lakemont University Medical Center. She sees patients in English, Gujarati and Hindi, and she often books longer first visits for patients who want family members to join the conversation.</p>'
