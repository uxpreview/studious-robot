  field_body:
    -
      value: "<p>Dr. Laila Haddad is a neuroscientist who studies how pain signals are created and amplified in the brain. Her lab focuses on the trigeminal nerve system, the network that carries sensation from the face and head and plays a central role in migraine. Her team studies why light, sound and lost sleep can set off an attack, and why attacks become more frequent for some people over time.</p><p>Dr. Haddad works closely with neurologist Dr. Elena Ruiz, and questions from Dr. Ruiz's clinic often shape the lab's experiments. The lab's work on PACAP, a signaling protein involved in migraine, helped inform the design of the migraine prevention study now enrolling at Calder. Her research is supported by national research agencies and private foundations.</p><p>As director of the PhD in Neuroscience program, Dr. Haddad oversees the training of more than 60 graduate students, and 14 PhD graduates have completed their degrees in her lab. She speaks English, Arabic and French. Dr. Haddad is a research scientist and does not see patients.</p>"
