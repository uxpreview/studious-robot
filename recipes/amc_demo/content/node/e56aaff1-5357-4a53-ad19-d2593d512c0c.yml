  field_body:
    -
      value: '<p>Migraine can be isolating. This free group meets online once a month and is led by a licensed clinical social worker from our Headache Medicine Program. Each session starts with a short topic and leaves plenty of time for conversation.</p><p>This month, neurologist Dr. Elena Ruiz joins as a guest to talk about preventive treatment options and answer general questions. She cannot give personal medical advice during the group, so please bring questions about your own care to your care team.</p><p>You are welcome whether or not you are a Calder patient, and family members and caregivers are welcome too. You can keep your camera off and simply listen.</p>'
