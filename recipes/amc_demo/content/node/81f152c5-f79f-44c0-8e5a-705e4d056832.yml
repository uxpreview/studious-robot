  field_body:
    -
      value: '<p>The Cardiovascular Disease Fellowship accepts four fellows each year. Over three years, fellows rotate through every part of the Heart &amp; Vascular Institute: the cardiac intensive care unit, the catheterization and heart rhythm labs, echocardiography and cardiac MRI, heart failure, preventive cardiology and congenital heart disease. Each fellow also runs a weekly continuity clinic at the Riverside Outpatient Center and follows the same patients for all three years.</p><p>Fellows have six months of protected research time. Many join the Arrhythmia Research Lab or work with investigators running clinical trials across the Institute, and every fellow presents at Cardiology Grand Rounds at least once before graduating.</p><p>Program director Dr. Priya Patel meets with each fellow every quarter to review goals, wellness and career plans. Graduates go on to advanced fellowships in electrophysiology, interventional cardiology, imaging and heart failure, or directly into practice.</p>'
      format: content_format
