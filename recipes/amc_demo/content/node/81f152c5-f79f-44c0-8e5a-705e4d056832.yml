  field_how_to_apply:
    -
      value: '<ol><li>Confirm that you will complete an accredited internal medicine residency by July 1 of the year you start.</li><li>Apply through the national electronic residency application service. We begin reviewing applications in July.</li><li>Include a personal statement, your CV and three letters of recommendation, one of them from your residency program director.</li><li>Submit your complete application by August 15.</li><li>If invited, interview with us online in September or October.</li><li>Rank programs through the national fellowship match. Results are released in early December.</li></ol><p>Questions? Email cardiology-fellowship@calder.example.</p>'
      format: content_format
