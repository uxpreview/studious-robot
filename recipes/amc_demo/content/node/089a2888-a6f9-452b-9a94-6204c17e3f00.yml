  field_body:
    -
      value: '<p>Pulsed field ablation has changed the AFib procedure room in just a few years. In this session, Dr. Priya Patel, director of the Cardiovascular Disease Fellowship and leader of the Arrhythmia Research Lab, reviews the current evidence, shares early experience from Calder and describes the design of the randomized study now enrolling at Calder University Hospital.</p><p><strong>After this session, participants should be able to:</strong></p><ul><li>Compare how pulsed field and radiofrequency energy create lesions in heart tissue</li><li>Describe current evidence on safety, procedure time and rhythm outcomes for each method</li><li>Identify patients who may benefit from earlier referral for ablation</li><li>Explain how wearable monitoring can detect AFib recurrence after ablation</li></ul><p>Lunch is provided for in-person attendees. The session will be recorded for registered participants.</p>'
