  field_body:
    -
      value: "<p>Migraine is more than a bad headache. It is a condition of the brain and nerves that causes repeated attacks, often with throbbing head pain, nausea and sensitivity to light and sound. It often runs in families and is about three times more common in women than in men.</p><p>Attacks can have up to four phases. Some people notice warning signs a day or two before, such as yawning, food cravings or a stiff neck. About 1 in 4 people have an aura, a short period of visual changes or tingling. Then comes the headache itself, followed by a day or so of feeling drained.</p><p>Common triggers include missed sleep, skipped meals, stress, hormonal changes, strong smells and alcohol. When attacks happen on 15 or more days a month for more than three months, it is called chronic migraine. Children can have migraine too, and our pediatricians at the Children's Pavilion care for kids with headaches.</p>"
      format: content_format
