  field_body:
    -
      value: '<p>The Heart &amp; Vascular Institute cares for people with atrial fibrillation and other heart rhythm problems, coronary artery disease, heart failure and congenital heart disease. Most visits happen at the Riverside Outpatient Center, where you can see a specialist, get an echocardiogram and start cardiac rehab in the same building. Procedures and hospital stays take place at Calder University Hospital, a short drive away.</p><p>Our specialists meet every week to review complex cases together. A patient with both heart failure and AFib, for example, may have a plan shaped by a heart failure cardiologist, a heart rhythm specialist and the nurse practitioner who will follow them between visits. Children and teens with heart conditions are cared for by pediatric cardiologists at the Children''s Pavilion, who work closely with our adult teams as patients grow up.</p><p>Because we are part of an academic health system, many patients can choose to join a clinical trial as part of their care. Ask your cardiologist about studies that may fit you, or <a href="/clinical-trials">browse studies that are enrolling now</a>.</p>'
      format: content_format
