  field_body:
    -
      value: '<p>At exactly noon, 139 envelopes opened at once in the atrium of the Medical Education Building, and the room erupted. Match Day, when graduating medical students learn where they will spend the next three to seven years of training, is the most emotional day of the year at the Calder University School of Medicine.</p><p>This year, 136 of 139 students, or 98 percent, matched into residency programs in 27 states. Forty-one percent will train in primary care fields, including family medicine, internal medicine and pediatrics. Twenty-four graduates will stay in Calder for residency at Calder University Hospital.</p><p>For Dr. James Okafor, Associate Dean for Admissions, the day closes a loop that began years earlier. "I interviewed many of these students when they were college seniors, nervous in borrowed suits," he says. "Today they''re doctors with a plan. That never gets old."</p><p>Eleven graduates matched into pediatrics, the most in the school''s history. Dr. Hannah Kim, who directs the pediatrics clerkship, says many of them first discovered the specialty during their eight weeks at the Children''s Pavilion. "Kids are honest patients," she says. "Students either love that or they don''t, and this class loved it."</p><p>The three students who did not match are working with advisers in the Office of Student Affairs to secure positions through the national process for unfilled residency spots.</p><p>Congratulations to every graduate, and to the families, faculty and staff who helped them get here.</p>'
