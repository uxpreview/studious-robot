  field_body:
    -
      value: "<p>Maria Santos is a nurse practitioner in the Heart Failure Clinic at the Riverside Outpatient Center. She sees patients between their cardiologist visits to adjust medicines, check lab results, look for early signs of fluid buildup and answer the questions that come up in daily life. Many patients see her within a week of leaving the hospital, when the risk of going back is highest.</p><p>Before becoming a nurse practitioner, she spent 12 years as a cardiac nurse at Calder University Hospital. She earned her Doctor of Nursing Practice at Westmoor University, where her final project focused on helping patients keep track of their daily weight. She now trains new nurses in the clinic and works with Dr. Marcus Reed on the clinic's at-home monitoring program.</p><p>Santos sees patients in English, Spanish and Portuguese. She also leads the Institute's free community heart screenings, where she checks blood pressure and heart rhythm and helps neighbors find follow-up care.</p>"
      format: content_format
