      value: 18–85
  field_body:
    -
      value: '<p><strong>Enrollment for this study is closed.</strong> The study team is following current participants and will share results after the last participant finishes.</p><p>The weeks after a hospital stay for heart failure are a risky time. Fluid can build up again before a person notices, and many people end up back in the hospital within a month. This study asks whether daily at-home readings, reviewed each weekday by the nurses and nurse practitioners in our Heart Failure Clinic, can catch those changes early enough to adjust medicines by phone.</p><p>Participants were assigned by chance to either remote monitoring or usual follow-up care for 12 months. Both groups continue to see their own heart doctor. We are comparing hospital readmissions, emergency visits, quality of life and how many people reach the full recommended doses of their heart failure medicines.</p>'
      format: content_format
