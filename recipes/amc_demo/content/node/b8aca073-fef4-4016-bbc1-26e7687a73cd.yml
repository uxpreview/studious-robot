  field_eligibility:
    -
      value: '<p>These were the requirements while the study was enrolling.</p><p><strong>You may be able to join if you:</strong></p><ul><li>Were 18–85 years old</li><li>Were in the hospital for heart failure in the past 30 days</li><li>Could stand on a scale safely each morning</li><li>Had home internet or could use a study-provided cellular hub</li></ul><p><strong>You may not be able to join if you:</strong></p><ul><li>Had a mechanical heart pump or were on a heart transplant waiting list</li><li>Were receiving hospice care</li><li>Needed dialysis for kidney failure</li><li>Lived in a nursing facility</li></ul>'
      format: content_format
