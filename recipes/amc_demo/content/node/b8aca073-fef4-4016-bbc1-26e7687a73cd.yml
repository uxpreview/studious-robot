  field_summary:
    -
      value: 'This study is testing whether a connected scale, a blood pressure cuff and a short daily check-in, reviewed by heart failure nurses, can catch problems early and help people avoid going back to the hospital. Enrollment is complete.'
  field_trial_status:
    -
      value: active_not_recruiting
  field_what_to_expect:
    -
      value: '<p>Current participants in the remote monitoring group can expect:</p><ul><li>Weight and blood pressure readings each morning, sent automatically</li><li>A five-question symptom check-in on the study tablet</li><li>A phone call from the clinic team when readings change, usually the same day</li></ul><p>All participants have study visits at the Riverside Outpatient Center at 3, 6 and 12 months. If you are a participant and have a question, call the study team. If you have severe symptoms, call 911.</p>'
      format: content_format
