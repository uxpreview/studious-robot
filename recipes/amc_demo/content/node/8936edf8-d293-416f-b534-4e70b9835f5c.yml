  field_diagnosis:
    -
      value: "<p>A fetal echocardiogram, a detailed ultrasound of the baby's heart, can find many heart differences during pregnancy. After birth, every newborn has a quick, painless pulse oximetry screening that measures oxygen in the blood.</p><p>To diagnose and plan treatment, a pediatric cardiologist may use an echocardiogram, an ECG, a chest x-ray, a cardiac MRI or CT scan, or a cardiac catheterization. At the Children's Pavilion, a faster MRI scan lets many children ages 4 and up have their scan awake, without sedation.</p>"
      format: content_format
  field_seek_care:
    -
      value: "Call 911 if your child is struggling to breathe, turns blue or gray around the lips or face, faints, has a seizure or is very hard to wake up. Call your child's heart team the same day if your baby is feeding poorly, sweating during feeds, breathing fast while resting or not gaining weight."
  field_summary:
    -
      value: 'Congenital heart disease is a difference in the structure of the heart that a baby is born with. Some types are mild and need no treatment, while others need surgery or a procedure, and most children with CHD now grow up to be healthy adults.'
  field_symptoms:
    -
      value: '<p>Many heart differences are found before birth on a routine ultrasound, or soon after birth with a simple oxygen test. Others are found later, sometimes when a doctor hears a heart murmur.</p><p><strong>In babies:</strong></p><ul><li>Fast or hard breathing</li><li>Blue or gray color of the lips, tongue or fingernails</li><li>Getting tired or sweaty while feeding</li><li>Slow weight gain</li><li>Being unusually sleepy</li></ul><p><strong>In older children and teens:</strong></p><ul><li>Getting tired or out of breath more easily than other kids during play</li><li>Fainting or chest pain during exercise</li><li>Swelling in the legs, belly or around the eyes</li><li>A heart murmur heard at a checkup</li></ul>'
      format: content_format
  field_treatment:
    -
      value: "<p>Treatment depends on the type of heart difference and how it affects your child. A pediatric cardiologist will explain the plan and what to expect over time.</p><h3>Watchful waiting</h3><p>Small holes and mild valve changes often need only regular checkups. Many close or improve on their own.</p><h3>Medicines</h3><p>Medicines can help the heart pump better, control heart rate or remove extra fluid while a child grows or waits for a procedure.</p><h3>Catheter procedures</h3><p>Using thin tubes passed through a blood vessel, doctors can close some holes, open narrow valves with a small balloon or widen narrowed blood vessels, often without open-heart surgery.</p><h3>Heart surgery</h3><p>Some children need surgery to repair the heart, sometimes in stages over the first few years of life.</p><h3>Lifelong care</h3><p>Children with CHD need regular heart checkups into adulthood. Our Pediatric Heart Clinic works with your child's pediatrician on everyday health, growth, vaccines and school, and helps teens get ready to move to adult congenital heart care.</p>"
      format: content_format
