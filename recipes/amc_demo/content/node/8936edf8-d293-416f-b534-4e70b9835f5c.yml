  field_body:
    -
      value: "<p>Congenital heart disease (CHD) means a baby is born with a difference in how the heart or nearby blood vessels formed. It is the most common type of birth defect, affecting about 1 in 100 babies.</p><p>Some heart differences are small and close on their own. Others affect how blood flows through the heart and need treatment soon after birth. Common types include holes between the heart's chambers (atrial or ventricular septal defects), narrow or leaky heart valves, a narrowed aorta (coarctation of the aorta) and tetralogy of Fallot. In most cases there is no clear cause, and nothing a parent did or did not do led to it.</p><p>Thanks to better treatment, most children with CHD now grow up to be adults. People with CHD need heart checkups throughout their lives, even after a successful repair.</p>"
      format: content_format
  field_departments:
