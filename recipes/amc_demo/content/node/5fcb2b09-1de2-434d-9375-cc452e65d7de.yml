  field_body:
    -
      value: '<p>Dr. Elena Ruiz is a neurologist and the director of the Headache Medicine Program at Calder University Hospital. She cares for adults with chronic <a href="/conditions/migraine">migraine</a>, migraine with aura, cluster headache and headaches that have not improved with earlier treatment. Her approach combines medicines, procedures such as nerve blocks and practical changes to sleep, meals and daily routines.</p><p>Dr. Ruiz earned both a medical degree and a PhD in neuroscience, and her research connects the clinic to the lab. She is the principal investigator of the migraine prevention study now enrolling at Calder, and she is a core member of Dr. Laila Haddad''s lab, where the team studies why attacks become more frequent for some people over time. She has a special interest in making headache care and research easier to reach for Spanish-speaking patients.</p><p>Dr. Ruiz is not accepting new patients right now. New patients with migraine can be seen by other members of the headache medicine team, usually within four to six weeks. She teaches neurology residents and joins the monthly virtual migraine support group as a guest speaker.</p>'
