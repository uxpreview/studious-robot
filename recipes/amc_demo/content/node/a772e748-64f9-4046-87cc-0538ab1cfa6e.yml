  field_recent_work:
    -
      value: 'Showed in lab models that a single night of lost sleep makes trigeminal nerve cells respond more strongly to light.'
    -
      value: 'Measured how PACAP levels change in the hours before and during a migraine attack in a group of 40 volunteers.'
    -
      value: 'Started a sensory testing study with Dr. Elena Ruiz to learn why light sensitivity lingers between attacks for some people with chronic migraine.'
