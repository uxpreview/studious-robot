  field_body:
    -
      value: '<p>Migraine affects about one in seven people worldwide, yet scientists still do not fully understand what starts an attack. The Haddad Lab, led by neuroscientist Dr. Laila Haddad, studies the trigeminal nerve system, the pathway that carries sensation from the face and head, to learn how ordinary signals like light, sound or a missed night of sleep can turn into hours of pain.</p><p>The lab combines studies in lab models with brain imaging and sensory testing in human volunteers. Its work on PACAP, a signaling protein that rises during migraine attacks, helped lay the groundwork for the migraine prevention study now enrolling at Calder.</p><p>Neurologist Dr. Elena Ruiz is a core member of the lab and brings questions straight from the Headache Medicine Program. First-year students in the Neuroscience PhD program often rotate through the lab.</p>'
      format: content_format
