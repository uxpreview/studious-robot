  field_body:
    -
      value: '<p>Dr. Hannah Kim is a general pediatrician at the Children''s Pavilion. She sees children from birth through age 18 for checkups, vaccines, sick visits and long-term conditions such as asthma, ADHD and childhood <a href="/conditions/migraine">migraine</a>. For children who also see specialists, including those with <a href="/conditions/congenital-heart-disease">congenital heart disease</a> followed in the Pediatric Heart Clinic, she is the home base that keeps everyone on the same page.</p><p>Dr. Kim directs the pediatrics clerkship, the required eight-week rotation in which third-year Calder medical students learn to care for children. Students spend time in her clinic, on the Pavilion''s inpatient unit and in the newborn nursery at Calder University Hospital. Students know her for giving specific, kind feedback on the same day.</p><p>Dr. Kim speaks English and Korean. Outside the exam room, she runs a program that gives a free picture book to every child at well-child visits from 6 months to 5 years old.</p>'
      format: content_format
