  field_eligibility:
    -
      value: '<p>These were the requirements while the study was enrolling.</p><p><strong>You may be able to join if your child:</strong></p><ul><li>Was 4–12 years old</li><li>Had congenital heart disease and needed a cardiac MRI as part of regular care</li><li>Could lie still for about 20 minutes while watching a movie, with a parent in the room</li></ul><p><strong>You may not be able to join if your child:</strong></p><ul><li>Had a pacemaker or other implant that is not safe for MRI</li><li>Needed sedation for another procedure on the same day</li><li>Had a medical condition that made it unsafe to be scanned without sedation</li></ul>'
      format: content_format
