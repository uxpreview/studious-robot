    -
      value: 4–12
  field_body:
    -
      value: "<p><strong>This study is complete and no longer enrolling.</strong></p><p>Children with congenital heart disease often need cardiac MRI scans to check how their heart is working. A standard scan can take close to an hour and asks children to hold their breath many times, so many young children need sedation to lie still. This study tested a faster scan that works while children breathe normally.</p><h3>What we found</h3><ul><li>118 children ages 4 to 12 took part.</li><li>101 of them (86 percent) finished the faster scan without sedation.</li><li>Average time in the scanner dropped from about 55 minutes to about 20 minutes.</li><li>Doctors rated the images good enough to guide care decisions in 112 of 118 scans.</li></ul><p>Based on these results, the faster scan is now the standard first choice for children ages 4 and up at the Children's Pavilion. Thank you to every family who took part.</p>"
      format: content_format
