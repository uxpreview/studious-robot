      value: completed
  field_what_to_expect:
    -
      value: '<p>For families who took part, the study added about 15 minutes to a regularly scheduled MRI visit.</p><ul><li>A child life specialist helped each child practice in a play scanner first.</li><li>Children watched a movie through special goggles during the scan, and a parent could stay in the room.</li><li>If the faster scan did not work, the care team used the usual approach, including sedation if needed.</li></ul><p>All participating families have received a letter summarizing the results. If you took part and have questions, contact the study team.</p>'
      format: content_format
