  field_body:
    -
      value: '<p>Thinking about applying to the Calder University School of Medicine? Spend a day with us and see what learning here is really like.</p><p>Dr. James Okafor, Associate Dean for Admissions, will open the day with an overview of our curriculum and what our admissions committee looks for. You will then tour the anatomy and simulation centers, join a sample small-group case session and have lunch with current medical students.</p><p><strong>Schedule</strong></p><ul><li>10:00 a.m.: Welcome and admissions overview</li><li>10:45 a.m.: Campus and simulation center tours</li><li>11:45 a.m.: Sample case-based learning session</li><li>12:30 p.m.: Lunch with current students</li><li>1:15 p.m.: Financial aid and student life panel</li></ul><p>Space is limited, so please RSVP. One guest per applicant is welcome.</p>'
      format: content_format
