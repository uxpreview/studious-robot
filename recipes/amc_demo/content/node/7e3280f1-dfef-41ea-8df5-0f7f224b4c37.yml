  field_body:
    -
      value: '<p>For 31 years, Carol Jennings taught eighth-grade science in Calder. When she retired, she finally had time for the thing she loved most: hiking. Every Saturday she and two friends from her old school drove out to the ridge trails north of town.</p><p>About two years ago, that changed. "I''d get halfway up a hill I''d climbed a hundred times and have to stop," she says. "My heart felt like it was flopping around in my chest." Her primary care doctor ordered an ECG, which showed atrial fibrillation, or AFib, a common heart rhythm problem.</p><p>Carol started a blood thinner to lower her stroke risk and a medicine to slow her heart rate. The medicines helped, but the episodes kept coming back, sometimes two or three times a week. Her doctor referred her to Dr. Priya Patel, a heart rhythm specialist at the Heart &amp; Vascular Institute.</p><p>At their first visit, Dr. Patel sketched Carol''s heart on the paper covering the exam table and walked her through three options: stay on her current medicines, try a rhythm control medicine or have a catheter ablation. "She never pushed," Carol says. "She told me what the numbers looked like for someone like me and asked what I wanted my life to look like." Carol chose ablation.</p><p>The procedure took less than two hours, and she went home that evening. Dr. Patel was clear that ablation does not work for everyone and that some people need a second procedure. For Carol, the first one held. Eight months later, a two-week patch monitor showed no AFib. She still takes a blood thinner, because her stroke risk calls for it whether or not AFib returns.</p><p>Last month, Carol and her friends hiked the full ridge loop, all 6 miles. "I''m slower than I was at 50," she says, laughing. "But I''m not stopping because of my heart anymore."</p>'
